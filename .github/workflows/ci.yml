name: CI
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a release with this tag (e.g. v1.6.1) from the dispatched commit"
        required: false
        default: ""
jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node test/harness.mjs
        working-directory: worker
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      # No include/config.h in CI: the build uses config.example.h placeholders. Such a firmware.bin is
      # meant for OTA onto a T-SIM already running >= 1.6.0, which keeps its real config in NVS.
      - run: pio run
        working-directory: firmware
      - name: Collect binaries
        run: |
          mkdir -p dist
          B=firmware/.pio/build/tsim7672g
          cp $B/firmware.bin $B/bootloader.bin $B/partitions.bin dist/
          cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin dist/
          (cd dist && sha256sum firmware.bin > firmware.bin.sha256 && cat firmware.bin.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: tsim-firmware
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_tag, 'v'))
    needs: [worker, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: tsim-firmware, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/firmware.bin
            dist/firmware.bin.sha256
            dist/bootloader.bin
            dist/partitions.bin
            dist/boot_app0.bin
