[env:tsim7672g]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DCORE_DEBUG_LEVEL=1
  -DSERIAL_FLASHER_INTERFACE_UART=1
  -DMD5_ENABLED=1
  -DSERIAL_FLASHER_RESET_HOLD_TIME_MS=100
  -DSERIAL_FLASHER_BOOT_HOLD_TIME_MS=50
  -DSERIAL_FLASHER_WRITE_BLOCK_RETRIES=3
  -DSERIAL_FLASHER_RESET_INVERT=0
  -DSERIAL_FLASHER_BOOT_INVERT=0
  -Ilib/esp-serial-flasher/include
  -Ilib/esp-serial-flasher/private_include
extra_scripts = pre:apply_patches.py
lib_ldf_mode = deep+
lib_deps =
  mobizt/ESP_SSLClient@3.1.3
