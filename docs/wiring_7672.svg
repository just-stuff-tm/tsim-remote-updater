<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
<rect width="1400" height="900" fill="#ffffff"/>
<text x="700" y="44" font-size="28" font-weight="bold" text-anchor="middle" fill="#111">T-SIM7672G ↔ Heltec V3 wiring (recommended)</text>
<text x="700" y="74" font-size="16" text-anchor="middle" fill="#444">Heltec powered from the same 1S Li-ion battery via its JST battery connector · no 3V3 link · shared GND</text>

<!-- Solar -->
<rect x="60" y="120" width="200" height="90" rx="8" fill="#fff8d6" stroke="#8a6d00" stroke-width="2"/>
<text x="160" y="158" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">Solar panel</text>
<text x="160" y="184" font-size="14" text-anchor="middle" fill="#333">(5–6 V)</text>
<!-- Battery -->
<rect x="60" y="300" width="200" height="140" rx="8" fill="#eef6ee" stroke="#2e7d32" stroke-width="2"/>
<text x="160" y="345" font-size="20" font-weight="bold" text-anchor="middle" fill="#111">1S Li-ion</text>
<text x="160" y="370" font-size="16" text-anchor="middle" fill="#333">18650, 3.0–4.2 V</text>
<text x="246" y="330" font-size="22" font-weight="bold" text-anchor="end" fill="#c62828">+</text>
<text x="246" y="430" font-size="22" font-weight="bold" text-anchor="end" fill="#111">−</text>

<!-- T-SIM -->
<rect x="400" y="120" width="300" height="560" rx="10" fill="#eef3fb" stroke="#1f4e9c" stroke-width="3"/>
<text x="550" y="156" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">LilyGO T-SIM7672G</text>
<text x="550" y="180" font-size="14" text-anchor="middle" fill="#333">controller · LTE · solar charger</text>
<!-- Heltec -->
<rect x="1000" y="120" width="300" height="560" rx="10" fill="#f6eefb" stroke="#6a1b9a" stroke-width="3"/>
<text x="1150" y="156" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">Heltec WiFi LoRa 32 V3</text>
<text x="1150" y="180" font-size="14" text-anchor="middle" fill="#333">MeshCore repeater</text>

<!-- T-SIM pin labels (right edge) -->
<g font-size="16" fill="#111">
<text x="415" y="222">SOLAR IN</text>
<text x="415" y="332">BAT +</text>
<text x="415" y="432">BAT −</text>
<text x="688" y="262" text-anchor="end">GPIO42 (TX)</text>
<text x="688" y="332" text-anchor="end">GPIO41 (RX)</text>
<text x="688" y="402" text-anchor="end">GPIO1 (RST out)</text>
<text x="688" y="472" text-anchor="end">GPIO2 (BOOT out)</text>
<text x="688" y="542" text-anchor="end">GND</text>
<text x="688" y="612" text-anchor="end" fill="#888">3V3</text>
</g>
<!-- Heltec pin labels (left edge) -->
<g font-size="16" fill="#111">
<text x="1012" y="262">GPIO44 (RX)</text>
<text x="1012" y="332">GPIO43 (TX)</text>
<text x="1012" y="402">RST / EN</text>
<text x="1012" y="472">GPIO0 / PRG (BOOT)</text>
<text x="1012" y="542">GND</text>
<text x="1012" y="612" fill="#888">3V3</text>
<text x="1288" y="652" text-anchor="end">JST battery (1.25 mm)</text>
</g>

<!-- Solar to T-SIM -->
<path d="M260 165 H330 V217 H400" fill="none" stroke="#e0a800" stroke-width="4"/>
<!-- Battery + with fuse to T-SIM and Heltec -->
<path d="M260 327 H400" fill="none" stroke="#c62828" stroke-width="4"/>
<rect x="290" y="315" width="44" height="24" rx="4" fill="#fff" stroke="#c62828" stroke-width="2"/>
<text x="312" y="332" font-size="13" text-anchor="middle" fill="#c62828">FUSE</text>
<path d="M360 327 V720 H1340 V645 H1300" fill="none" stroke="#c62828" stroke-width="4"/>
<!-- Battery - -->
<path d="M260 427 H400" fill="none" stroke="#111" stroke-width="4"/>
<path d="M380 427 V740 H1360 V660 H1300" fill="none" stroke="#111" stroke-width="4"/>
<circle cx="360" cy="327" r="5" fill="#c62828"/><circle cx="380" cy="427" r="5" fill="#111"/>
<text x="860" y="712" font-size="15" text-anchor="middle" fill="#c62828">battery + (fused) → Heltec JST +</text>
<text x="860" y="760" font-size="15" text-anchor="middle" fill="#111">battery − → Heltec JST −  (check JST polarity with a meter!)</text>

<!-- Signal wires (crossed TX/RX) -->
<g stroke-width="4" fill="none">
<path d="M700 257 H1000" stroke="#1565c0"/>
<path d="M700 327 H1000" stroke="#2e7d32"/>
<path d="M700 397 H1000" stroke="#ef6c00"/>
<path d="M700 467 H1000" stroke="#6a1b9a"/>
<path d="M700 537 H1000" stroke="#111"/>
</g>
<!-- optional 1k resistors -->
<g font-size="13" text-anchor="middle">
<rect x="820" y="247" width="60" height="20" rx="3" fill="#fff" stroke="#1565c0" stroke-width="2"/><text x="850" y="262" fill="#1565c0">1 kΩ*</text>
<rect x="820" y="317" width="60" height="20" rx="3" fill="#fff" stroke="#2e7d32" stroke-width="2"/><text x="850" y="332" fill="#2e7d32">1 kΩ*</text>
</g>
<g font-size="14" text-anchor="middle" fill="#333">
<text x="850" y="244">T-SIM TX → Heltec RX</text>
<text x="850" y="314">T-SIM RX ← Heltec TX</text>
<text x="850" y="388">reset</text>
<text x="850" y="458">boot / download mode</text>
<text x="850" y="528">shared ground</text>
</g>
<!-- NO 3V3 -->
<path d="M700 607 H1000" stroke="#999" stroke-width="3" stroke-dasharray="10 8" fill="none"/>
<line x1="830" y1="590" x2="870" y2="624" stroke="#c62828" stroke-width="5"/><line x1="870" y1="590" x2="830" y2="624" stroke="#c62828" stroke-width="5"/>
<text x="850" y="645" font-size="17" font-weight="bold" text-anchor="middle" fill="#c62828">NO 3V3 link</text>
<!-- caps -->
<text x="550" y="660" font-size="13" text-anchor="middle" fill="#444">optional 10 µF + 100 nF on 3V3/GND</text>
<text x="1150" y="575" font-size="13" text-anchor="middle" fill="#444">optional 10 µF + 100 nF on 3V3/GND</text>

<!-- Legend & notes -->
<rect x="60" y="790" width="1280" height="96" rx="8" fill="#fafafa" stroke="#ccc"/>
<g font-size="14" fill="#111">
<text x="80" y="814" font-weight="bold">Legend</text>
<rect x="180" y="804" width="26" height="6" fill="#c62828"/><text x="212" y="812">battery +</text>
<rect x="290" y="804" width="26" height="6" fill="#111"/><text x="322" y="812">battery − / GND</text>
<rect x="440" y="804" width="26" height="6" fill="#e0a800"/><text x="472" y="812">solar</text>
<rect x="530" y="804" width="26" height="6" fill="#1565c0"/><text x="562" y="812">TX→RX</text>
<rect x="630" y="804" width="26" height="6" fill="#2e7d32"/><text x="662" y="812">RX←TX</text>
<rect x="730" y="804" width="26" height="6" fill="#ef6c00"/><text x="762" y="812">RST</text>
<rect x="810" y="804" width="26" height="6" fill="#6a1b9a"/><text x="842" y="812">BOOT</text>
<text x="910" y="812">* optional series resistor</text>
<text x="80" y="842">• Never plug USB into the Heltec while it is battery-wired: its charger would charge the shared cell.  • The T-SIM charges the battery from solar.</text>
<text x="80" y="868">• The T-SIM can RESET the Heltec (GPIO1) but cannot power-cycle it.  • JST battery polarity is not standardized: verify + / − with a meter first.</text>
</g>
</svg>
